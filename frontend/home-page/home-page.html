<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <!-- custom styles after bootstrap so they take precedence -->
    <link rel="stylesheet" href="home-page.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <!-- Sidebar: visible from md, collapsed by default, expands on hover -->
      <div class="sidebar d-none d-md-flex" id="sidebar">
        <!-- Button to pin/unpin the sidebar open -->
        <button
          id="sidebarToggle"
          class="sidebar-toggle d-md-none"
          type="button"
          aria-expanded="false"
          aria-label="Pin sidebar open"
        >
          <!-- modern inline SVG list icon (inherits currentColor) -->
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill-rule="evenodd" d="M2.5 12.5a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11zm0-4a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11zm0-4a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11z"/>
          </svg>
        </button>

        <ul class="nav nav-pills flex-column sidebar-nav">
          <li class="nav-item">
            <a href="#" class="nav-link active">
              <i class="bi bi-wrench-adjustable"></i>
              <span class="label">Service Orders</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="bi bi-car-front"></i>
              <span class="label">Vehicles</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="bi bi-cash-coin"></i>
              <span class="label">Finance</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="bi bi-people"></i>
              <span class="label">Clients / Staff</span>
            </a>
          </li>
        </ul>

        <a href="#" class="sidebar-user">
          <i class="bi bi-person-circle"></i>
          <div>
            <div class="user-name label">Alex Pires</div>
            <div class="user-role label">Admin</div>
          </div>
        </a>
      </div>

      <!-- Right column: mobile topbar + content -->
      <div class="d-flex flex-column flex-fill">
        <!-- Topbar: visible below md, with the hamburger -->
        <nav class="navbar mobile-topbar d-md-none px-3 py-2">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#mobileSidebar"
            aria-controls="mobileSidebar"
            aria-label="Open menu"
          >
            <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path fill-rule="evenodd" d="M2.5 12.5a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11zm0-4a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11zm0-4a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11z"/>
            </svg>
          </button>
        </nav>

        <div class="content"></div>
      </div>
    </div>

    <!-- Offcanvas sidebar for mobile -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="mobileSidebarLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column p-0 px-3 pb-3">
        <ul class="nav nav-pills flex-column sidebar-nav">
          <li class="nav-item">
            <a href="#" class="nav-link active">
              <i class="bi bi-wrench-adjustable"></i>
              <span class="label" style="display:inline;">Service Orders</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="bi bi-car-front"></i>
              <span class="label" style="display:inline;">Vehicles</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="bi bi-cash-coin"></i>
              <span class="label" style="display:inline;">Finance</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="bi bi-people"></i>
              <span class="label" style="display:inline;">Clients / Staff</span>
            </a>
          </li>
        </ul>

        <a href="#" class="sidebar-user mt-auto" style="justify-content:flex-start;">
          <i class="bi bi-person-circle"></i>
          <div>
            <div class="user-name" style="display:block;">Alex Pires</div>
            <div class="user-role" style="display:block;">Admin</div>
          </div>
        </a>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      // Pin/unpin the sidebar open on desktop (independent from hover)
      (function () {
        const btn = document.getElementById("sidebarToggle");
        const sidebar = document.getElementById("sidebar");
        if (!btn || !sidebar) return;
        btn.addEventListener("click", () => {
          const pinned = sidebar.classList.toggle("pinned");
          btn.setAttribute("aria-expanded", String(pinned));
          // swap inline SVG: list <-> x (close)
          if (pinned) {
            btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/></svg>';
          } else {
            btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill-rule="evenodd" d="M2.5 12.5a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11zm0-4a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11zm0-4a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11z"/></svg>';
          }
        });
      })();
    </script>
  </body>
</html>
